# iOS derlemesi GitHub'ın macOS makinesinde (eas build --local): EAS derleme hakkı HARCAMAZ.
# Depo herkese açık olduğu için GitHub macOS dakikaları ücretsizdir; ayda 15 iOS sınırına takılmayız.
# İmza bilgileri (sertifika, profil) EAS'tan indirilir. İsteğe bağlı olarak TestFlight'a gönderir.
# Gerekli GitHub secret'ları: EXPO_TOKEN, ASC_API_KEY (.p8 içeriği), ASC_ISSUER_ID.
name: iOS derle (yerel, ücretsiz)

on:
  workflow_dispatch:
    inputs:
      gonder:
        description: "Bitince TestFlight'a gönder"
        type: boolean
        default: true
      makine:
        description: "GitHub macOS makinesi"
        type: choice
        options: [macos-26, macos-15]
        default: macos-26
      xcode:
        description: "Xcode sürümü (boş = makinedeki en yeni)"
        type: string
        default: ""

jobs:
  ios:
    runs-on: ${{ inputs.makine }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Xcode seç (en yeni)
        run: |
          ls -d /Applications/Xcode*.app
          if [ -n "${{ inputs.xcode }}" ]; then X=/Applications/Xcode_${{ inputs.xcode }}.app; else X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Araçlar
        run: |
          npm install -g eas-cli@latest
          which fastlane || brew install fastlane
          which pod || sudo gem install cocoapods
          pod --version
      - name: Paketleri kur
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: App Store Connect anahtarını yaz
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          printf '%s\n' "$ASC_API_KEY" > "$RUNNER_TEMP/asc.p8"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/asc.p8" || { echo "ASC_API_KEY secret'ı eksik ya da hatalı"; exit 1; }
      - name: Derle (bu makinede)
        # Apple anahtarı burada verilmez: EAS kayıtlı sertifika ve profilleri doğrudan kullanır,
        # Apple'ın geliştirici sunucusu hata verdiğinde derleme durmaz. Anahtar yalnız gönderimde kullanılır.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          LANG: en_US.UTF-8
        run: eas build -p ios --profile production --local --non-interactive --output "$RUNNER_TEMP/kurandan.ipa"
      - name: IPA'yı sakla
        uses: actions/upload-artifact@v4
        with:
          name: kurandan-ipa
          path: ${{ runner.temp }}/kurandan.ipa
          retention-days: 14
      - name: TestFlight'a gönder
        if: ${{ inputs.gonder }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc.p8
          EXPO_ASC_KEY_ID: 6QNDBXCP8X
          EXPO_APPLE_TEAM_ID: 34J4Q96FX6
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        # Sonucu bekler: Apple tarafı geçici hata verirse 3 kez yeniden dener, olmazsa iş kırmızı biter.
        run: |
          for i in 1 2 3; do
            eas submit -p ios --profile production --path "$RUNNER_TEMP/kurandan.ipa" --non-interactive && exit 0
            echo "Gönderim başarısız ($i/3), 60 sn sonra yeniden"; sleep 60
          done
          exit 1
