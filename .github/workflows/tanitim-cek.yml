# Tanıtım videoları için uygulama ekranları (web derlemesi) ve marka yazı tipleri → "tanitim-kayit" dalı (main'e dokunmaz).
name: Tanıtım kayıtları

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npx expo export --platform web --output-dir dist-web
      - run: npm install --no-save --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Çek
        run: |
          npx --yes serve@14.2.4 -s dist-web -l 8081 > /dev/null 2>&1 &
          sleep 5
          node scripts/tanitim-cek.js
          mkdir -p tanitim/fonts
          for f in Lora_700Bold.ttf Lora_600SemiBold.ttf PlusJakartaSans_500Medium.ttf PlusJakartaSans_700Bold.ttf PlusJakartaSans_800ExtraBold.ttf; do find node_modules/@expo-google-fonts -name "$f" -exec cp {} tanitim/fonts/ \; ; done
          ls tanitim tanitim/fonts
      - name: Ayrı dala koy
        run: |
          mkdir -p /tmp/e && cp -r tanitim /tmp/e/
          git config user.name "ocakoguzcan-oss"; git config user.email "ocakoguzcan-oss@users.noreply.github.com"
          git checkout --orphan tanitim-kayit && git rm -rfq . && cp -r /tmp/e/tanitim . && git add tanitim && git commit -qm "Tanıtım kayıtları (ham)" && git push -f origin tanitim-kayit
