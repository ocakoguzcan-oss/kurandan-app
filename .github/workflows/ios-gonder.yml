# Hazır iOS derlemesini App Store Connect'e (TestFlight) gönderir.
# Expo'nun ücretsiz CI/CD dakikası bitince yedek yol: gönderimi GitHub Actions üzerinden yapar
# (Expo Submit her planda ücretsizdir; yalnızca Expo Workflows içindeki iş dakika harcar).
# Elle başlatılır: GitHub → Actions → "iOS gönder" → Run workflow.
# Gerekli GitHub secret'ları: EXPO_TOKEN, ASC_API_KEY (.p8 dosyasının içeriği), ASC_ISSUER_ID.
name: iOS gönder

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "EAS derleme kimliği (boş bırakılırsa en son iOS derlemesi)"
        required: false
        default: ""

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paketleri kur
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: App Store Connect anahtarını yaz
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          printf '%s\n' "$ASC_API_KEY" > "$RUNNER_TEMP/asc.p8"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/asc.p8" || { echo "ASC_API_KEY secret'ı eksik ya da hatalı"; exit 1; }
      - name: Gönder
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc.p8
          EXPO_ASC_KEY_ID: 6QNDBXCP8X
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -n "${{ github.event.inputs.build_id }}" ]; then SRC="--id ${{ github.event.inputs.build_id }}"; else SRC="--latest"; fi
          npx --yes eas-cli@latest submit -p ios --profile production $SRC --non-interactive
