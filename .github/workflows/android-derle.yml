# Android derlemesi (EAS): Google Play'e yüklenecek .aab dosyası.
# İlk yüklemeyi Google Play kuralı gereği Play Console'dan elle yaparsınız (indirme bağlantısı derleme sayfasında).
# Sonraki sürümler için Play hizmet hesabı anahtarı eklenince "Play'e gönder" adımı açılır.
# Elle başlatılır: GitHub → Actions → "Android derle" → Run workflow.
# Gerekli GitHub secret'ı: EXPO_TOKEN. İsteğe bağlı: GOOGLE_PLAY_KEY (hizmet hesabı JSON içeriği),
# GOOGLE_MAPS_API_KEY (Android haritası; yoksa Yakın Camiler yalnız liste gösterir).
name: Android derle

on:
  workflow_dispatch:
    inputs:
      profil:
        description: "preview = telefona doğrudan kurulan test APK'sı, production = Google Play için .aab"
        type: choice
        options: [preview, production]
        default: preview
      gonder:
        description: "Bittikten sonra Google Play'e (dahili test kanalı) gönder"
        type: boolean
        default: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paketleri kur
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Google Maps anahtarını EAS'a aktar
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then echo "GOOGLE_MAPS_API_KEY yok: Android'de harita kapalı kalır"; exit 0; fi
          for ortam in preview production; do
            npx --yes eas-cli@latest env:create --name GOOGLE_MAPS_API_KEY --value "$GOOGLE_MAPS_API_KEY" \
              --environment $ortam --visibility sensitive --force --non-interactive
          done
          echo "Google Maps anahtarı hazır"
      - name: Derle (EAS, bitene kadar bekler)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: npx --yes eas-cli@latest build -p android --profile ${{ inputs.profil }} --non-interactive --wait
      - name: Google Play'e gönder
        if: ${{ inputs.gonder && inputs.profil == 'production' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_KEY }}
        run: |
          printf '%s' "$GOOGLE_PLAY_KEY" > "$RUNNER_TEMP/play.json"
          grep -q '"private_key"' "$RUNNER_TEMP/play.json" || { echo "GOOGLE_PLAY_KEY secret'ı eksik"; exit 1; }
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH="$RUNNER_TEMP/play.json" npx --yes eas-cli@latest submit -p android --profile production --latest --non-interactive --no-wait
