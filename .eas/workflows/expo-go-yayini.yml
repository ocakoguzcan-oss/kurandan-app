# main dalına her gönderimde uygulamanın yeni halini Expo Go'da denenmek üzere yayınlar.
# (App Store'daki kullanıcılara gitmez; onlar için bkz. magaza-guncelleme.yml)
name: Expo Go'ya yayınla

on:
  push:
    branches: ['main']

jobs:
  update:
    name: Güncellemeyi yayınla
    type: update
    params:
      channel: main
